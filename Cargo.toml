[package]
name = "componentize-js"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.1"
tokio = { version = "1.49.0", features = ["macros", "rt", "rt-multi-thread", "fs"] }
wasmtime = "47.0.1"
wasmtime-wasi = "47.0.1"
wasmtime-wizer = { version = "47.0.1", features = ["component-model", "wasmtime"] }
wasm-encoder = "0.254.0"
wit-component = "0.254.0"
wit-dylib = "0.254.0"
wit-parser = "0.254.0"
zstd = "0.13.3"
heck = "0.5.0"
clap = { version = "4.6.0", features = ["derive"] }
clap_derive = "4.6.0"
indexmap = "2.13.0"

[workspace]
members = ["runtime"]

[build-dependencies]
anyhow = "1.0.100"
wasm-encoder = "0.254.0"
wasmparser = "0.254.0"
zstd = "0.13.3"

[dev-dependencies]
futures = "0.3.32"
hex = "0.4.3"
http = "1.4.0"
http-body-util = "0.1.3"
proptest = "1.10.0"
rand = "0.10.0"
wasmtime-wasi = "47.0.1"
wasmtime-wasi-http = "47.0.1"
